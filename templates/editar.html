<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Editar contador</title>
</head>
<body>
  <a class="voltar" href="/"><span class="seta">←</span> Voltar</a>
  <h1>Editar contador</h1>
  <form method="post">
    <input type="text" name="nome" value="{{ c.nome }}" required>
    <input type="date" name="inicio" value="{{ c.inicio }}" required>
    <input type="color" name="cor" value="{{ c.cor }}">
    <input type="text" name="emoji" value="{{ c.emoji }}" maxlength="2">
    <button>Salvar</button>
  </form>

</body>
</html>
